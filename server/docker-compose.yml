# One-command dev server: Postgres + Nakama with the Konesans module.
# Build the module first: `npm run build` (produces server/nakama/build/index.js)
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: nakama, POSTGRES_PASSWORD: localdb }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 10 }

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.22.0
    depends_on: { postgres: { condition: service_healthy } }
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name konesans --database.address postgres:localdb@postgres:5432/nakama
        --runtime.js_entrypoint index.js --logger.level INFO
        --session.token_expiry_sec 7200 --socket.max_message_size_bytes 65536
    volumes: [ "./nakama/build:/nakama/data/modules" ]
    ports: [ "7350:7350", "7351:7351" ]   # 7350 API/socket, 7351 admin console (change the default password!)

volumes: { pgdata: {} }
