<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.COLS = 20;
    this.ROWS = 12;
    this.state = { gone: {}, count: 0, revealed: false };
    this.isDown = false;
  }
  scratchAt(e) {
    if (this.state.revealed) return;
    const r = e.currentTarget.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const col = Math.floor(((e.clientX - r.left) / r.width) * this.COLS);
    const row = Math.floor(((e.clientY - r.top) / r.height) * this.ROWS);
    const gone = { ...this.state.gone };
    let added = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (Math.abs(dr) + Math.abs(dc) > 1 && Math.random() < 0.5) continue;
        const rr = row + dr;
        const cc = col + dc;
        if (rr < 0 || cc < 0 || rr >= this.ROWS || cc >= this.COLS) continue;
        const k = rr * this.COLS + cc;
        if (!gone[k]) { gone[k] = true; added++; }
      }
    }
    if (!added) return;
    const count = this.state.count + added;
    const revealed = count >= this.COLS * this.ROWS * 0.5;
    this.setState({ gone, count, revealed });
  }
  renderVals() {
    const { gone, count, revealed } = this.state;
    const total = this.COLS * this.ROWS;
    const cells = [];
    for (let i = 0; i < total; i++) {
      const x = (i % this.COLS) * 15;
      const y = Math.floor(i / this.COLS) * 15;
      const off = revealed || gone[i];
      cells.push({
        style: 'display: block; width: 15px; height: 15px; background-image: radial-gradient(circle at 3px 3px, rgba(255,255,255,.45) 1.4px, transparent 2px), linear-gradient(135deg, #F5B700 0%, #FFE58A 24%, #E0A100 46%, #FFE58A 64%, #C99400 100%); background-size: 10px 10px, 300px 180px; background-position: -' + x + 'px -' + y + 'px, -' + x + 'px -' + y + 'px; transition: opacity .3s ease, transform .3s ease; ' + (off ? 'opacity: 0; transform: scale(.3) rotate(25deg);' : 'opacity: 1;')
      });
    }
    const pct = revealed ? 100 : Math.min(99, Math.round((count / (total * 0.5)) * 100));
    return {
      cells,
      revealed,
      notRevealed: !revealed,
      showLabel: !revealed && count < 12,
      pct,
      barW: 'width: ' + pct + '%;',
      points: revealed ? '290' : '240',
      bubble: revealed ? 'Bravo! Ou genyen Catherine Flon ak 50 pwen!' : 'Grate kat lò a ak dwèt ou pou w wè kado w!',
      frameGlow: revealed ? 'animation: rGlow 1.4s ease-in-out 2;' : 'animation: rWiggle 2.4s ease-in-out infinite;',
      coverAnim: revealed ? 'pointer-events: none;' : '',
      shineAnim: revealed ? 'animation: rShine 1.8s ease-in-out .3s infinite;' : '',
      down: (e) => {
        this.isDown = true;
        if (e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} }
        this.scratchAt(e);
      },
      move: (e) => { if (this.isDown) this.scratchAt(e); },
      up: () => { this.isDown = false; },
      revealAll: () => this.setState({ revealed: true })
    };
  }
}
</script>
