<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<title>Peyi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F47B5;text-decoration:none}a:hover{color:#163585}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7FB; font-family: 'Nunito', system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Categories.dc.html" aria-label="Retounen nan kategori yo" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 2px solid #E3E7F1; display: flex; align-items: center; justify-content: center; color: #14213D; flex-shrink: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
</a>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; line-height: 1.1; font-weight: 800">Peyi</h1>
<span style="font-size: 13px; color: #5A6480; font-weight: 700">Drapo · Kapital · Fòm — Karayib</span>
</div>
<span style="background: #FFFFFF; border: 2px solid #E3E7F1; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px">3 / 10</span>
</div>

<div role="group" aria-label="Mòd jwèt" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #E3E7F1; border-radius: 16px; padding: 4px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
<a href="Shape.dc.html" style="min-height: 44px; border-radius: 12px; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; color: #5A6480">Fòm</a>
</div>

<div style="background: #FFFFFF; border: 2px solid #E3E7F1; border-bottom-width: 5px; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<sc-if value="{{isFlag}}" hint-placeholder-val="{{ true }}">
<svg role="img" aria-label="Yon drapo: kwa jòn, triyang nwa ak triyang vèt" width="240" height="120" viewBox="0 0 12 6" style="border-radius: 10px; box-shadow: 0 0 0 1px #D9DEEA, 0 6px 16px rgba(20,33,61,0.12)"><rect width="12" height="6" fill="#009B3A"></rect><polygon points="0,0 0,6 6,3" fill="#000000"></polygon><polygon points="12,0 12,6 6,3" fill="#000000"></polygon><path d="M0 0L12 6M12 0L0 6" stroke="#FED100" stroke-width="1"></path></svg>
</sc-if>
<sc-if value="{{isCapital}}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Drapo Kiba" width="240" height="120" viewBox="0 0 30 15" style="border-radius: 10px; box-shadow: 0 0 0 1px #D9DEEA, 0 6px 16px rgba(20,33,61,0.12)"><rect width="30" height="15" fill="#FFFFFF"></rect><rect y="0" width="30" height="3" fill="#002A8F"></rect><rect y="6" width="30" height="3" fill="#002A8F"></rect><rect y="12" width="30" height="3" fill="#002A8F"></rect><polygon points="0,0 0,15 13,7.5" fill="#CF142B"></polygon><polygon points="4.5,5.2 5.03,6.77 6.69,6.79 5.36,7.78 5.85,9.36 4.5,8.4 3.15,9.36 3.64,7.78 2.31,6.79 3.97,6.77" fill="#FFFFFF"></polygon></svg>
<span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.02em">KIBA</span>
</sc-if>
</div>

<div style="display: flex; align-items: center; gap: 10px; margin: 2px 0 0"><button type="button" aria-label="Koute kesyon an" style="width: 44px; height: 44px; border-radius: 14px; background: #4D7CFE; color: #FFFFFF; border: 2px solid #14213D; box-shadow: 0 3px 0 #14213D; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg></button><h2 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; line-height: 1.15; font-weight: 800">{{question}}</h2></div>

<div role="group" aria-label="Repons" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{options}}" as="opt" hint-placeholder-count="4">
<button type="button" onClick="{{opt.pick}}" style="{{opt.style}}">{{opt.text}}</button>
</sc-for>
</div>

<sc-if value="{{picked}}" hint-placeholder-val="{{ false }}">
<div role="status" style="{{feedbackStyle}}">{{feedback}}</div>
</sc-if>

<sc-if value="{{picked}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{next}}" style="margin-top: auto; min-height: 56px; width: 100%; border: none; border-radius: 16px; background: #1F47B5; color: #FFFFFF; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #14307D">Pwochen kesyon</button>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'flag', picked: null };
  }
  renderVals() {
    const { mode, picked } = this.state;
    const sets = {
      flag: {
        question: 'Ki peyi drapo sa a ye?',
        options: [
          { id: 'a', text: 'Bahamas' },
          { id: 'b', text: 'Jamayik', ok: true },
          { id: 'c', text: 'Babad' },
          { id: 'd', text: 'Sent Lisi' }
        ],
        right: 'Bravo! Se drapo Jamayik. Kapital li se Kingston.',
        wrong: 'Se pa sa. Se drapo Jamayik. Kapital li se Kingston.'
      },
      capital: {
        question: 'Ki kapital Kiba?',
        options: [
          { id: 'a', text: 'Santiago' },
          { id: 'b', text: 'Kingston' },
          { id: 'c', text: 'Lavàn', ok: true },
          { id: 'd', text: 'Nasò' }
        ],
        right: 'Bravo! Lavàn se kapital Kiba.',
        wrong: 'Se pa sa. Kapital Kiba se Lavàn.'
      }
    };
    const set = sets[mode];
    const segBase = 'min-height: 44px; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; ';
    const modes = [
      { id: 'flag', label: 'Drapo' },
      { id: 'capital', label: 'Kapital' }
    ].map((m) => {
      const on = m.id === mode;
      return {
        label: m.label,
        pressed: on ? 'true' : 'false',
        style: segBase + (on ? 'background: #FFFFFF; color: #1F47B5; box-shadow: 0 2px 6px rgba(20,33,61,0.12);' : 'background: transparent; color: #5A6480;'),
        pick: () => this.setState({ mode: m.id, picked: null })
      };
    });
    const base = 'min-height: 64px; width: 100%; padding: 8px 10px; border-radius: 16px; font-size: 18px; font-weight: 800; color: #14213D; cursor: pointer; box-sizing: border-box; ';
    const options = set.options.map((o) => {
      let style = base + 'background: #FFFFFF; border: 2px solid #D9DEEA; border-bottom-width: 4px;';
      if (picked && o.ok) style = base + 'background: #E3F4EA; border: 2px solid #17803F; border-bottom-width: 4px; color: #12632F;';
      else if (picked === o.id) style = base + 'background: #FDE7EC; border: 2px solid #D21034; border-bottom-width: 4px; color: #8F0A22;';
      return {
        text: o.text,
        style,
        pick: () => { if (!this.state.picked) this.setState({ picked: o.id }); }
      };
    });
    const right = !!picked && set.options.some((o) => o.ok && o.id === picked);
    return {
      modes,
      isFlag: mode === 'flag',
      isCapital: mode === 'capital',
      question: set.question,
      options,
      picked: !!picked,
      feedback: right ? set.right : set.wrong,
      feedbackStyle: 'border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 700; line-height: 1.35; ' + (right ? 'background: #E3F4EA; color: #12632F;' : 'background: #FDE7EC; color: #8F0A22;'),
      next: () => this.setState({ mode: mode === 'flag' ? 'capital' : 'flag', picked: null })
    };
  }
}
</script>
</body>
</html>
