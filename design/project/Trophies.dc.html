<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<title>Twofe m</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F47B5;text-decoration:none}
button{font-family:inherit}
@keyframes tShine{0%{transform:translateX(-150%) rotate(20deg)}100%{transform:translateX(350%) rotate(20deg)}}
@keyframes tPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7FB; font-family: 'Nunito', system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column; padding: 20px 20px 26px; gap: 12px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Retounen" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 2px solid #E3E7F1; display: flex; align-items: center; justify-content: center; color: #14213D; box-sizing: border-box; flex-shrink: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
</a>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; line-height: 1.1; font-weight: 800">Twofe m</h1>
<span style="font-size: 13px; color: #5A6480; font-weight: 700">9 sou 30 badj · Toti 27</span>
</div>
<button type="button" onClick="{{share}}" style="min-height: 44px; padding: 0 12px; border-radius: 14px; background: #25D366; color: #14213D; border: 2px solid #14213D; box-shadow: 0 3px 0 #14213D; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
{{shareLabel}}
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0; overflow-y: auto">
<sc-for list="{{shelves}}" as="sh" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 0">
<span style="font-weight: 800; font-size: 14px; color: #5A6480; margin-bottom: 6px">{{sh.title}}</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 6px 10px">
<sc-for list="{{sh.badges}}" as="b" hint-placeholder-count="4">
<button type="button" onClick="{{b.pick}}" aria-label="{{b.aria}}" aria-pressed="{{b.on}}" style="{{b.style}}">
<span style="{{b.medal}}">
<sc-if value="{{b.earned}}" hint-placeholder-val="{{ true }}"><span style="font-size: 26px; line-height: 1">{{b.glyph}}</span><span aria-hidden="true" style="position: absolute; top: -10px; left: 0; width: 14px; height: 90px; background: rgba(255,255,255,.5); animation: tShine 3s ease-in-out infinite; {{b.shineDelay}}"></span></sc-if>
<sc-if value="{{b.locked}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A93A8" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
</span>
</button>
</sc-for>
</div>
<div aria-hidden="true" style="height: 12px; border-radius: 4px; background: linear-gradient(#D98A3A, #B5651D); border: 2px solid #14213D; box-shadow: 0 4px 0 #7A4212"></div>
</div>
</sc-for>
</div>

<div role="status" style="background: #FFFFFF; border: 3px solid #14213D; border-bottom-width: 7px; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; animation: tPop .35s cubic-bezier(.34,1.56,.64,1) both; {{detailKey}}">
<span style="{{sel.medal}}"><span style="font-size: 34px; line-height: 1">{{sel.glyph}}</span></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.1">{{sel.name}}</span>
<span style="font-size: 14px; font-weight: 700; color: #3B4560">{{sel.how}}</span>
<span style="font-size: 12px; font-weight: 800; color: {{sel.dateColor}}">{{sel.date}}</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'premye', shared: false };
  }
  renderVals() {
    const groups = [
      { title: 'Aprantisaj', badges: [
        { id: 'premye', glyph: '🌱', name: 'Premye pa', how: 'Fini premye leson ou', date: '12 okt 2026', tier: 'bronz' },
        { id: 'seri7', glyph: '🔥', name: 'Seri 7 jou', how: '7 jou san rete', date: '19 okt 2026', tier: 'ajan' },
        { id: 'mo100', glyph: '📚', name: '100 mo', how: 'Aprann 100 mo angle', date: '28 okt 2026', tier: 'ajan' },
        { id: 'seri30', glyph: '🏆', name: 'Seri 30 jou', how: '30 jou san rete', date: null, tier: 'lo' }
      ]},
      { title: 'Defi', badges: [
        { id: 'duel1', glyph: '⚡', name: 'Premye viktwa', how: 'Genyen yon defi 1 kont 1', date: '14 okt 2026', tier: 'bronz' },
        { id: 'duel10', glyph: '🥊', name: '10 viktwa', how: 'Genyen 10 defi', date: '30 okt 2026', tier: 'ajan' },
        { id: 'fanmi', glyph: '🏠', name: 'Bat tonton w', how: 'Genyen yon defi fanmi', date: '1 nov 2026', tier: 'ajan' },
        { id: 'lig', glyph: '👑', name: 'Lig Lò', how: 'Rive nan Lig Lò', date: null, tier: 'lo' }
      ]},
      { title: 'Ayiti', badges: [
        { id: 'drapo', glyph: '🇭🇹', name: '18 me', how: 'Jwe evènman Jou Drapo', date: '18 me 2026', tier: 'ajan' },
        { id: 'vwayaj3', glyph: '🗺️', name: '3 depatman', how: 'Debloke 3 depatman', date: '25 okt 2026', tier: 'bronz' },
        { id: 'detektif', glyph: '🔍', name: 'Detektif', how: 'Jwenn kachèt sekrè a', date: '30 okt 2026', tier: 'lo' },
        { id: 'vetye', glyph: '⚔️', name: 'Vètyè', how: 'Jwe evènman 18 novanm', date: null, tier: 'lo' }
      ]}
    ];
    const tierBg = { bronz: 'linear-gradient(160deg,#F2B07A,#B5651D)', ajan: 'linear-gradient(160deg,#F1F3F8,#A7B0C4)', lo: 'linear-gradient(160deg,#FFE58A,#E0A100)' };
    let selB = null;
    const shelves = groups.map((g, gi) => ({
      title: g.title,
      badges: g.badges.map((b, bi) => {
        const earned = !!b.date, on = b.id === this.state.sel;
        if (on) selB = b;
        return {
          glyph: b.glyph, earned, locked: !earned, on: on ? 'true' : 'false',
          aria: b.name + (earned ? ', genyen ' + b.date : ', poko genyen'),
          shineDelay: 'animation-delay: ' + ((gi * 4 + bi) * .35) + 's;',
          style: 'background: none; border: none; padding: 0 0 2px; cursor: pointer; display: flex; justify-content: center; ' + (on ? 'transform: translateY(-4px);' : ''),
          medal: 'position: relative; overflow: hidden; width: 64px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; border: 3px solid ' + (on ? '#1F47B5' : '#14213D') + '; background: ' + (earned ? tierBg[b.tier] : '#E3E7F1') + ';',
          pick: () => this.setState({ sel: b.id })
        };
      })
    }));
    const s = selB || groups[0].badges[0];
    const earned = !!s.date;
    return {
      shelves,
      detailKey: '',
      sel: {
        glyph: s.glyph, name: s.name, how: s.how,
        date: earned ? 'Genyen ' + s.date : 'Poko genyen · kontinye!',
        dateColor: earned ? '#2F9E44' : '#5A6480',
        medal: 'width: 64px; height: 64px; flex-shrink: 0; border-radius: 32px; display: flex; align-items: center; justify-content: center; border: 3px solid #14213D; background: ' + (earned ? tierBg[s.tier] : '#E3E7F1') + ';'
      },
      shareLabel: this.state.shared ? 'Voye!' : 'Pataje',
      share: () => this.setState({ shared: true })
    };
  }
}
</script>
</body>
</html>
