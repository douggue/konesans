<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null, checked: false };
  }
  renderVals() {
    const { picked, checked } = this.state;
    const list = [
      { id: 'a', text: 'Good morning, where are you?' },
      { id: 'b', text: 'Hello, how are you?', ok: true },
      { id: 'c', text: 'Goodbye, see you soon!' }
    ];
    const base = 'min-height: 60px; width: 100%; text-align: left; padding: 12px 18px; border-radius: 18px; font-size: 18px; font-weight: 800; color: #14213D; cursor: pointer; box-sizing: border-box; transition: transform .12s; ';
    const options = list.map((o) => {
      const on = picked === o.id;
      return {
        ...o,
        checked: on ? 'true' : 'false',
        style: base + (on ? 'background: #E6ECFB; border: 2px solid #4D7CFE; border-bottom-width: 5px; transform: translateY(2px);' : 'background: #FFFFFF; border: 2px solid #D9DEEA; border-bottom-width: 5px;'),
        pick: () => { if (!this.state.checked) this.setState({ picked: o.id }); }
      };
    });
    const right = picked === 'b';
    return {
      options,
      checked,
      right: checked && right,
      wrong: checked && !right,
      noPick: !picked,
      check: () => { if (this.state.picked) this.setState({ checked: true }); },
      checkStyle: 'width: 100%; min-height: 56px; border-radius: 16px; font-size: 18px; font-weight: 800; letter-spacing: 0.02em; ' + (picked ? 'background: #4D7CFE; color: #FFFFFF; cursor: pointer; border: 2px solid #14213D; box-shadow: 0 4px 0 #14213D;' : 'background: #DCE1EE; color: #5A6480; cursor: not-allowed; border: 2px solid #DCE1EE;'),
      title: right ? 'Bravo! Se sa menm.' : 'Pa grav, eseye ankò!',
      bonus: right ? '+10 pwen' : 'Ti Zwazo kwè nan ou',
      detail: right ? '“Kijan ou ye?” = “How are you?”. Ou ka di l ak nenpòt moun.' : 'Bon repons lan se: “Hello, how are you?”. “Kijan ou ye?” vle di “How are you?”.',
      sheetStyle: 'position: relative; padding: 26px 20px 28px; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 12px; animation: sUp .55s cubic-bezier(.32,.72,0,1) both; ' + (right ? 'background: #D3F9D8; color: #12632F; border-top: 3px solid #51CF66;' : 'background: #FFE3E8; color: #8F0A22; border-top: 3px solid #FF8FA3;'),
      continueStyle: 'min-height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #FFFFFF; border: 2px solid #14213D; box-sizing: border-box; animation: sFade .35s ease-out .45s both; ' + (right ? 'background: #2F9E44; box-shadow: 0 4px 0 #14213D;' : 'background: #E03150; box-shadow: 0 4px 0 #14213D;')
    };
  }
}
</script>
