<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<title>Orè Etid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F47B5;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7FB; font-family: 'Nunito', system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column; padding: 20px 20px 26px; gap: 14px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Parent.dc.html" aria-label="Retounen" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 2px solid #E3E7F1; display: flex; align-items: center; justify-content: center; color: #14213D; box-sizing: border-box; flex-shrink: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
</a>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; line-height: 1.1; font-weight: 800">Orè Etid</h1>
<span style="font-size: 13px; color: #5A6480; font-weight: 700">Espas Paran · pou Toti 27</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 800; font-size: 15px">Ki jou?</span>
<div role="group" aria-label="Jou" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" aria-label="{{d.aria}}" style="{{d.style}}">{{d.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 800; font-size: 15px">Ki lè?</span>
<div style="background: #FFFFFF; border: 2px solid #E3E7F1; border-bottom-width: 5px; border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{earlier}}" aria-label="Pi bonè" style="width: 44px; height: 44px; border-radius: 12px; border: 2px solid #D9DEEA; background: #FFFFFF; font-size: 22px; font-weight: 800; cursor: pointer">−</button>
<span role="status" style="flex-grow: 1; text-align: center; font-family: 'Baloo 2', sans-serif; font-size: 30px; font-weight: 800">{{time}}</span>
<button type="button" onClick="{{later}}" aria-label="Pi ta" style="width: 44px; height: 44px; border-radius: 12px; border: 2px solid #D9DEEA; background: #FFFFFF; font-size: 22px; font-weight: 800; cursor: pointer">+</button>
</div>
<div role="group" aria-label="Sijesyon" style="display: flex; gap: 6px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 800; font-size: 15px">Konbyen tan?</span>
<div role="group" aria-label="Dire" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{durs}}" as="du" hint-placeholder-count="4">
<button type="button" onClick="{{du.pick}}" aria-pressed="{{du.on}}" style="{{du.style}}">{{du.label}}</button>
</sc-for>
</div>
</div>

<div style="background: #E6ECFB; border-radius: 20px; padding: 14px; display: flex; gap: 12px; align-items: flex-start">
<svg aria-hidden="true" width="66" height="70" viewBox="-20 -10 200 210" style="flex-shrink: 0">
<path d="M36 92 C8 100 4 136 22 150 C30 134 38 122 44 110 Z" fill="#14307D"></path><path d="M124 92 C152 100 156 136 138 150 C130 134 122 122 116 110 Z" fill="#14307D"></path>
<ellipse cx="80" cy="112" rx="50" ry="62" fill="#1F47B5"></ellipse><ellipse cx="80" cy="132" rx="32" ry="38" fill="#E6ECFB"></ellipse>
<circle cx="62" cy="90" r="13" fill="#FFFFFF"></circle><circle cx="98" cy="90" r="13" fill="#FFFFFF"></circle><circle cx="65" cy="92" r="6" fill="#14213D"></circle><circle cx="95" cy="92" r="6" fill="#14213D"></circle>
<path d="M70 104 L90 104 L80 120 Z" fill="#F5B700" stroke="#C99400" stroke-width="2"></path>
<path d="M50 52 L80 38 L110 52 L80 66 Z" fill="#14213D"></path><path d="M60 56 L60 68 Q80 78 100 68 L100 56 L80 66 Z" fill="#14213D"></path><path d="M110 52 L114 74" stroke="#D21034" stroke-width="3" stroke-linecap="round"></path><circle cx="114" cy="78" r="5" fill="#D21034"></circle>
</svg>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; color: #14307D">SA TI MALFINI AP DI</span>
<span style="font-weight: 800; font-size: 15px; color: #14307D; line-height: 1.3">{{summary}}</span>
<span style="font-size: 13px; font-weight: 700; color: #3B4560">Rapèl 10 min anvan sou widjèt la. Pa gen rapèl apre 8 è diswa.</span>
</div>
</div>

<div style="background: #FFFFFF; border: 2px solid #E3E7F1; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 15px">Pèmèt jwe andeyò orè a</span><span style="font-size: 12px; font-weight: 700; color: #5A6480">Si non, app la louvri sèlman nan lè etid</span></span>
<button type="button" role="switch" aria-checked="{{freeOn}}" aria-label="Pèmèt jwe andeyò orè a" onClick="{{flipFree}}" style="{{freeTrack}}"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block; box-shadow: 0 1px 3px rgba(20,33,61,.3)"></span></button>
</div>

<button type="button" onClick="{{save}}" style="margin-top: auto; min-height: 56px; border-radius: 16px; background: #2F9E44; color: #FFFFFF; border: 3px solid #14213D; box-shadow: 0 5px 0 #14213D; font-size: 18px; font-weight: 800; cursor: pointer">{{saveLabel}}</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { days: [true, true, true, true, true, false, false], mins: 16 * 60, dur: 15, free: true, saved: false };
  }
  renderVals() {
    const s = this.state;
    const names = ['Lendi', 'Madi', 'Mèkredi', 'Jedi', 'Vandredi', 'Samdi', 'Dimanch'];
    const days = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((l, i) => ({
      label: l, aria: names[i], on: s.days[i] ? 'true' : 'false',
      style: 'min-height: 46px; border-radius: 14px; font-weight: 800; font-size: 16px; cursor: pointer; ' + (s.days[i] ? 'background: #1F47B5; color: #FFFFFF; border: 2px solid #14213D; box-shadow: 0 3px 0 #14213D;' : 'background: #FFFFFF; color: #14213D; border: 2px solid #D9DEEA; border-bottom-width: 4px;'),
      pick: () => { const n = [...s.days]; n[i] = !n[i]; this.setState({ days: n, saved: false }); }
    }));
    const fmt = (m) => { const h = Math.floor(m / 60), mm = m % 60; return h + ':' + (mm < 10 ? '0' : '') + mm; };
    const presets = [['Apre lekòl', 16 * 60], ['Apre manje', 18 * 60 + 30], ['Samdi maten', 9 * 60]].map(([label, m]) => ({
      label, style: 'flex: 1; min-height: 40px; border-radius: 999px; font-size: 13px; font-weight: 800; cursor: pointer; ' + (s.mins === m ? 'background: #14213D; color: #FFFFFF; border: 2px solid #14213D;' : 'background: #FFFFFF; color: #14213D; border: 2px solid #D9DEEA;'),
      pick: () => this.setState({ mins: m, saved: false })
    }));
    const durs = [10, 15, 20, 30].map((d) => ({
      label: d + ' min', on: s.dur === d ? 'true' : 'false',
      style: 'min-height: 46px; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; ' + (s.dur === d ? 'background: #FF9F43; color: #14213D; border: 2px solid #14213D; box-shadow: 0 3px 0 #14213D;' : 'background: #FFFFFF; color: #14213D; border: 2px solid #D9DEEA; border-bottom-width: 4px;'),
      pick: () => this.setState({ dur: d, saved: false })
    }));
    const on = s.days.map((v, i) => v ? names[i] : null).filter(Boolean);
    const dayTxt = on.length === 5 && !s.days[5] && !s.days[6] ? 'lendi rive vandredi' : on.length === 7 ? 'chak jou' : on.length ? on.join(', ') : 'okenn jou';
    return {
      days, presets, durs, time: fmt(s.mins),
      earlier: () => this.setState({ mins: Math.max(6 * 60, s.mins - 15), saved: false }),
      later: () => this.setState({ mins: Math.min(20 * 60, s.mins + 15), saved: false }),
      summary: '«Toti 27, nou gen randevou ' + dayTxt + ' a ' + fmt(s.mins) + ' pou ' + s.dur + ' minit!»',
      freeOn: s.free ? 'true' : 'false',
      freeTrack: 'width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; background: ' + (s.free ? '#2F9E44' : '#B9C2D6') + '; justify-content: ' + (s.free ? 'flex-end' : 'flex-start') + ';',
      flipFree: () => this.setState({ free: !s.free, saved: false }),
      saveLabel: s.saved ? 'Orè a sove ✓' : 'Sove orè a',
      save: () => this.setState({ saved: true })
    };
  }
}
</script>
</body>
</html>
