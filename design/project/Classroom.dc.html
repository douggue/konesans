<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<title>Mòd Klas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F47B5;text-decoration:none}a:hover{color:#163585}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #F6F7FB; font-family: 'Nunito', system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column">

<div style="height: 72px; flex-shrink: 0; background: #14213D; color: #FFFFFF; display: flex; align-items: center; gap: 24px; padding: 0 32px">
<span style="font-family: 'Baloo 2', sans-serif; font-size: 26px; font-weight: 800">Konesans</span>
<span style="background: #D21034; border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 15px">Mòd Klas</span>
<span style="flex-grow: 1"></span>
<span style="font-size: 18px; font-weight: 800; color: #C9D5F5">Kesyon 5 / 15</span>
<span style="background: #FFFFFF; color: #14213D; border-radius: 12px; padding: 6px 16px; font-weight: 800; font-size: 18px">Kòd klas: 482 731</span>
</div>

<div style="flex-grow: 1; display: flex; gap: 28px; padding: 28px 32px; min-height: 0">

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 22px; min-width: 0">
<div style="display: flex; align-items: center; gap: 14px">
<span style="background: #FDE7EC; color: #B00D2B; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 16px">Istwa Ayiti</span>
<span style="font-size: 16px; font-weight: 700; color: #5A6480">Elèv yo leve kat A, B, C oswa D</span>
</div>
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 48px; line-height: 1.1; font-weight: 800">Ki moun ki te fè bati Sitadèl Laferyè?</h1>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{answers}}" as="a" hint-placeholder-count="4">
<div style="{{a.style}}">
<span style="{{a.badgeStyle}}">{{a.letter}}</span>
<span style="flex-grow: 1; font-size: 28px; font-weight: 800">{{a.text}}</span>
<sc-if value="{{a.showOk}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#17803F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
</sc-if>
</div>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; gap: 12px; align-items: center">
<button type="button" onClick="{{reveal}}" style="{{revealStyle}}">{{revealLabel}}</button>
<button type="button" onClick="{{next}}" style="min-height: 56px; padding: 0 24px; border-radius: 16px; background: #FFFFFF; color: #14213D; border: 2px solid #D9DEEA; font-size: 18px; font-weight: 800; cursor: pointer">Pwochen kesyon</button>
<span style="flex-grow: 1"></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
20 s
</span>
</div>
</div>

<div style="width: 340px; flex-shrink: 0; background: #FFFFFF; border: 2px solid #E3E7F1; border-bottom-width: 5px; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800">Ekip yo</h2>
<span style="font-size: 14px; font-weight: 700; color: #5A6480; margin-top: -8px">Pwofesè a bay pwen ekip ki jwenn li</span>
<sc-for list="{{teams}}" as="t" hint-placeholder-count="4">
<div style="{{t.rowStyle}}">
<span style="{{t.dotStyle}}">{{t.mono}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column">
<span style="font-weight: 800; font-size: 17px">{{t.name}}</span>
<span style="font-size: 14px; font-weight: 800; color: #5A6480">{{t.score}} pwen</span>
</span>
<button type="button" onClick="{{t.add}}" aria-label="{{t.aria}}" style="min-height: 48px; padding: 0 14px; border-radius: 14px; background: #17803F; color: #FFFFFF; border: none; font-size: 17px; font-weight: 800; cursor: pointer">+10</button>
</div>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { revealed: false, scores: { lanbi: 40, kolibri: 30, mango: 50, tanbou: 20 } };
  }
  renderVals() {
    const { revealed, scores } = this.state;
    const opts = [
      { letter: 'A', text: 'Alexandre Pétion', color: '#1F47B5' },
      { letter: 'B', text: 'Henri Christophe', color: '#D21034', ok: true },
      { letter: 'C', text: 'Toussaint Louverture', color: '#B5651D' },
      { letter: 'D', text: 'Jean-Pierre Boyer', color: '#5B3FB5' }
    ];
    const answers = opts.map((o) => {
      const dim = revealed && !o.ok;
      const win = revealed && o.ok;
      return {
        letter: o.letter,
        text: o.text,
        showOk: win,
        style: 'min-height: 96px; border-radius: 22px; padding: 14px 20px; display: flex; align-items: center; gap: 18px; box-sizing: border-box; ' + (win ? 'background: #E3F4EA; border: 3px solid #17803F;' : 'background: #FFFFFF; border: 3px solid #D9DEEA;') + (dim ? ' opacity: 0.45;' : ''),
        badgeStyle: 'width: 60px; height: 60px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: \'Baloo 2\', sans-serif; font-size: 32px; font-weight: 800; color: #FFFFFF; background: ' + (win ? '#17803F' : o.color) + ';'
      };
    });
    const defs = [
      { id: 'lanbi', name: 'Ekip Lanbi', color: '#0E7C86' },
      { id: 'kolibri', name: 'Ekip Kolibri', color: '#5B3FB5' },
      { id: 'mango', name: 'Ekip Mango', color: '#B5651D' },
      { id: 'tanbou', name: 'Ekip Tanbou', color: '#D21034' }
    ];
    const top = Math.max(...defs.map((d) => scores[d.id]));
    const teams = defs.map((d) => {
      const lead = scores[d.id] === top;
      return {
        name: d.name,
        mono: d.name.split(' ')[1].charAt(0),
        score: scores[d.id],
        aria: 'Bay ' + d.name + ' 10 pwen',
        rowStyle: 'min-height: 68px; border-radius: 16px; padding: 8px 10px; display: flex; align-items: center; gap: 12px; ' + (lead ? 'background: #FFF4D1; border: 2px solid #F5B700;' : 'background: #F6F7FB; border: 2px solid transparent;'),
        dotStyle: 'width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: \'Baloo 2\', sans-serif; font-weight: 800; font-size: 20px; color: #FFFFFF; background: ' + d.color + ';',
        add: () => this.setState({ scores: { ...this.state.scores, [d.id]: this.state.scores[d.id] + 10 } })
      };
    });
    return {
      answers,
      teams,
      reveal: () => this.setState({ revealed: true }),
      next: () => this.setState({ revealed: false }),
      revealLabel: revealed ? 'Se B: Henri Christophe' : 'Montre repons lan',
      revealStyle: 'min-height: 56px; padding: 0 24px; border-radius: 16px; border: none; font-size: 18px; font-weight: 800; color: #FFFFFF; cursor: pointer; ' + (revealed ? 'background: #17803F; box-shadow: 0 4px 0 #0F5A2C;' : 'background: #1F47B5; box-shadow: 0 4px 0 #14307D;')
    };
  }
}
</script>
</body>
</html>
