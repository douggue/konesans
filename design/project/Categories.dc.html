<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { age: '9–11' };
  }
  renderVals() {
    const base = 'min-height: 44px; padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: 14px; cursor: pointer; ';
    const ages = ['6–8', '9–11', '12–14'].map((label) => {
      const on = this.state.age === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        style: base + (on ? 'background: #4D7CFE; color: #FFFFFF; border: 2px solid #14213D; box-shadow: 0 3px 0 #14213D;' : 'background: #FFFFFF; color: #14213D; border: 2px solid #D9DEEA; box-shadow: 0 3px 0 #D9DEEA;'),
        pick: () => this.setState({ age: label })
      };
    });
    return { ages };
  }
}
</script>
