<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<title>Vwayaj Ayiti</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F47B5;text-decoration:none}a:hover{color:#163585}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7FB; font-family: 'Nunito', system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Retounen lakay" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 2px solid #E3E7F1; display: flex; align-items: center; justify-content: center; color: #14213D; flex-shrink: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
</a>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; line-height: 1.1; font-weight: 800">Vwayaj Ayiti</h1>
<span style="font-size: 13px; color: #5A6480; font-weight: 700">3 / 10 depatman debloke</span>
</div>
</div>

<div style="background: #14213D; color: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 12px; background: #D21034; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4"></path><path d="M4 4h13l-2 4 2 4H4"></path></svg>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #F5B700">EVÈNMAN · 18 NOVANM</span>
<span style="font-size: 15px; font-weight: 800; line-height: 1.25">Batay Vètyè: kesyon espesyal, pwen doub!</span>
</div>
</div>

<div style="position: relative; width: 350px; height: 432px; background: #E6F2EC; border-radius: 24px; border: 1px solid #CFE3D7; flex-shrink: 0">
<svg aria-hidden="true" width="350" height="432" viewBox="0 0 350 432" style="position: absolute; left: 0; top: 0"><polyline points="60,52 175,52 290,52 290,160 175,160 60,160 60,268 175,268 290,268 175,376" fill="none" stroke="#9FC4AE" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="10">
<div style="{{n.wrap}}">
<button type="button" onClick="{{n.pick}}" aria-label="{{n.aria}}" aria-pressed="{{n.pressed}}" style="{{n.style}}">
<sc-if value="{{n.done}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
</sc-if>
<sc-if value="{{n.current}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="#F5B700" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
</sc-if>
<sc-if value="{{n.locked}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A6480" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
</sc-if>
</button>
<span style="font-size: 12px; font-weight: 800; color: #14213D; text-align: center; line-height: 1.1">{{n.name}}</span>
</div>
</sc-for>
</div>

<div style="background: #FFFFFF; border: 2px solid #E3E7F1; border-bottom-width: 5px; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 800; line-height: 1.1">{{sel.name}}</h2>
<span style="font-size: 13px; font-weight: 800; color: #5A6480">Chèf-lye: {{sel.city}}</span>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start"><svg aria-hidden="true" width="54" height="57" viewBox="-20 -10 200 210" style="flex-shrink: 0"><path d="M36 92 C8 100 4 136 22 150 C30 134 38 122 44 110 Z" fill="#14307D"></path><ellipse cx="80" cy="112" rx="50" ry="62" fill="#1F47B5"></ellipse><ellipse cx="80" cy="132" rx="32" ry="38" fill="#E6ECFB"></ellipse><circle cx="62" cy="90" r="13" fill="#FFFFFF"></circle><circle cx="98" cy="90" r="13" fill="#FFFFFF"></circle><circle cx="65" cy="92" r="6" fill="#14213D"></circle><circle cx="95" cy="92" r="6" fill="#14213D"></circle><path d="M70 104 L90 104 L80 120 Z" fill="#F5B700" stroke="#C99400" stroke-width="2"></path><path d="M122 102 C134 114 120 132 96 126 C104 118 110 110 114 102 Z" fill="#14307D"></path><path d="M50 52 L80 38 L110 52 L80 66 Z" fill="#14213D"></path><path d="M60 56 L60 68 Q80 78 100 68 L100 56 L80 66 Z" fill="#14213D"></path><path d="M110 52 L114 74" stroke="#D21034" stroke-width="3" stroke-linecap="round"></path><circle cx="114" cy="78" r="5" fill="#D21034"></circle></svg><p style="margin: 0; font-size: 14px; font-weight: 600; color: #3B4560; line-height: 1.4">{{sel.fact}}</p></div>
<sc-if value="{{sel.playable}}" hint-placeholder-val="{{ true }}">
<a href="Duel.dc.html" style="min-height: 48px; border-radius: 14px; background: #1F47B5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #14307D">{{sel.cta}}</a>
</sc-if>
<sc-if value="{{sel.isLocked}}" hint-placeholder-val="{{ false }}">
<span style="min-height: 48px; border-radius: 14px; background: #E3E7F1; color: #5A6480; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">Fini Grandans pou w debloke l</span>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'grandans' };
  }
  renderVals() {
    const deps = [
      { id: 'lwes', name: 'Lwès', city: 'Pòtoprens', x: 60, y: 52, status: 'done', fact: 'Se depatman kote kapital peyi a ye. Plis moun rete la pase nan nenpòt lòt depatman.' },
      { id: 'sides', name: 'Sidès', city: 'Jakmèl', x: 175, y: 52, status: 'done', fact: 'Jakmèl popilè pou kanaval li ak bèl mask papye mache atis yo fè.' },
      { id: 'sid', name: 'Sid', city: 'Okay', x: 290, y: 52, status: 'done', fact: 'Pak Nasyonal Pik Makaya, nan depatman Sid, se lakay anpil plant ak bèt ki pa jwenn okenn lòt kote.' },
      { id: 'grandans', name: 'Grandans', city: 'Jeremi', x: 290, y: 160, status: 'current', fact: 'Yo rele Jeremi "Vil Powèt yo" paske anpil gwo ekriven ayisyen soti la.' },
      { id: 'nip', name: 'Nip', city: 'Miragwàn', x: 175, y: 160, status: 'locked', fact: 'Nip se pi piti depatman Ayiti.' },
      { id: 'sant', name: 'Sant', city: 'Ench', x: 60, y: 160, status: 'locked', fact: 'Depatman Sant toupre fwontyè ak Repiblik Dominikèn.' },
      { id: 'latibonit', name: 'Latibonit', city: 'Gonayiv', x: 60, y: 268, status: 'locked', fact: 'Se nan Gonayiv Dessalines te deklare endepandans Ayiti, 1ye janvye 1804.' },
      { id: 'nodwes', name: 'Nòdwès', city: 'Pòdepè', x: 175, y: 268, status: 'locked', fact: 'Kristòf Kolon te rive sou zile a bò Mòl Sen Nikola, nan Nòdwès, an 1492.' },
      { id: 'no', name: 'Nò', city: 'Okap', x: 290, y: 268, status: 'locked', fact: 'Sitadèl Laferyè, sou yon mòn toupre Milo, se pi gwo fò nan Amerik yo.' },
      { id: 'nodes', name: 'Nòdès', city: 'Fòlibète', x: 175, y: 376, status: 'locked', fact: 'Fòlibète bati bò yon gwo be natirèl, ak plizyè vye fò kolonyal.' }
    ];
    const selId = this.state.sel;
    const nodes = deps.map((d) => {
      const on = d.id === selId;
      let bg = '#DCE1EE'; let shadow = '#C3CADB';
      if (d.status === 'done') { bg = '#17803F'; shadow = '#0F5A2C'; }
      if (d.status === 'current') { bg = '#1F47B5'; shadow = '#14307D'; }
      const size = d.status === 'current' ? 64 : 56;
      return {
        name: d.name,
        aria: d.name + (d.status === 'done' ? ', fini' : d.status === 'current' ? ', kounye a' : ', fèmen'),
        pressed: on ? 'true' : 'false',
        done: d.status === 'done',
        current: d.status === 'current',
        locked: d.status === 'locked',
        wrap: 'position: absolute; left: ' + (d.x - 45) + 'px; top: ' + (d.y - size / 2) + 'px; width: 90px; display: flex; flex-direction: column; align-items: center; gap: 4px;',
        style: 'width: ' + size + 'px; height: ' + size + 'px; border-radius: ' + (size / 2) + 'px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: ' + bg + '; box-shadow: 0 5px 0 ' + shadow + (on ? ', 0 0 0 5px #F5B700' : '') + ';',
        pick: () => this.setState({ sel: d.id })
      };
    });
    const s = deps.find((d) => d.id === selId);
    return {
      nodes,
      sel: {
        name: s.name,
        city: s.city,
        fact: s.fact,
        playable: s.status !== 'locked',
        isLocked: s.status === 'locked',
        cta: s.status === 'done' ? 'Jwe ankò' : 'Jwe 10 kesyon sou ' + s.name
      }
    };
  }
}
</script>
</body>
</html>
