<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, running: false, done: false };
    this.path = [[4, 0], [3, 0], [2, 0], [1, 0], [1, 1], [1, 2], [1, 3]];
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const { step, running, done } = this.state;
    const pos = this.path[step];
    const goal = this.path[this.path.length - 1];
    const onPath = (r, c) => this.path.some((p) => p[0] === r && p[1] === c);
    const cells = [];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const isRobot = pos[0] === r && pos[1] === c;
        const isGoal = goal[0] === r && goal[1] === c && !isRobot;
        const bg = onPath(r, c) ? '#E6ECFB' : '#DCE1EE';
        cells.push({
          robot: isRobot,
          goal: isGoal,
          style: 'height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: ' + (isGoal ? '#FFF4D1' : bg) + ';'
        });
      }
    }
    const run = () => {
      if (this.state.running) return;
      if (this.state.done) { this.setState({ step: 0, done: false }); return; }
      this.setState({ step: 0, running: true });
      this.timer = setInterval(() => {
        const next = this.state.step + 1;
        if (next >= this.path.length - 1) {
          clearInterval(this.timer);
          this.timer = null;
          this.setState({ step: next, running: false, done: true });
        } else {
          this.setState({ step: next });
        }
      }, 380);
    };
    const btnBase = 'min-height: 54px; width: 100%; border: none; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; color: #FFFFFF; cursor: pointer; ';
    return {
      cells,
      run,
      runLabel: done ? 'Bravo! +15 pwen · Rekòmanse' : (running ? 'Robo ap mache…' : 'Kouri pwogram nan'),
      runStyle: btnBase + (done ? 'background: #17803F; box-shadow: 0 4px 0 #0F5A2C;' : 'background: #1F47B5; box-shadow: 0 4px 0 #14307D;')
    };
  }
}
</script>
