# Ships the kids' app on every push to main: an over-the-air update when only JS changed, a new APK otherwise.
# Needs one repository secret: EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: EAS Android preview
on:
  push:
    branches: [main]
    # Question-bank-only changes don't need a new APK: phones get questions from the server after Publish.
    paths: ['apps/mobile/**', 'packages/core/**', '!packages/core/src/content/bank.ts', 'package.json', 'package-lock.json', 'tools/eas-ship.sh']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx vitest run --root packages/core
      - name: Over-the-air update, or a new APK when native code changed
        run: tools/eas-ship.sh apps/mobile
